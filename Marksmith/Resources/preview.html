<!DOCTYPE html>
<!--
  Marksmith preview shell.
  Swift injects rendered HTML through updateContent() / setTheme().
  Third-party renderers are vendored locally so the preview works offline.
-->
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link id="marksmith-theme" rel="stylesheet" href="preview-light.css">
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <link id="marksmith-hljs-theme" rel="stylesheet" href="vendor/highlight/github.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", Helvetica, Arial, sans-serif;
            line-height: 1.65;
            max-width: 820px;
            margin: 0 auto;
            padding: 24px 28px 60px;
            -webkit-font-smoothing: antialiased;
        }
        #content { overflow-wrap: break-word; }
        .marksmith-mermaid { text-align: center; margin: 1.2em 0; overflow-x: auto; }
        .marksmith-mermaid svg { max-width: 100%; height: auto; }
        @media print {
            body { max-width: none; padding: 0 12mm; }
            pre, blockquote, table, .marksmith-mermaid { break-inside: avoid; }
            h1, h2, h3, h4, h5, h6 { break-after: avoid; }
        }
    </style>
</head>
<body>
    <div id="content"></div>

    <script src="vendor/katex/katex.min.js"></script>
    <script src="vendor/katex/auto-render.min.js"></script>
    <script src="vendor/highlight/highlight.min.js"></script>
    <script src="vendor/mermaid/mermaid.min.js"></script>
    <script src="preview-runtime.js"></script>
</body>
</html>
